workflows:
  android-workflow:
    name: Math Learning App - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: math_learning_app
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.math_learning_app"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build APK (release)
        script: |
          flutter build apk --release

    artifacts:
      - math_learning_app/build/**/outputs/**/*.apk
      - math_learning_app/build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
