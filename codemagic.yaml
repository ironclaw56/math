workflows:
  android-workflow:
    name: Math Learning App - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.math_learning_app"

    scripts:
      - name: Debug - show repo root structure
        script: |
          echo "----- Current directory -----"
          pwd
          echo "----- Files at repo root -----"
          ls -la
          echo "----- Search for pubspec.yaml -----"
          find . -name "pubspec.yaml" -not -path "*/ephemeral/*"

    artifacts:
      - math_learning_app/build/**/outputs/**/*.apk
      - build/**/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
