name: math_learning_app
description: "A modern, offline-first Mathematics learning app for Class 9-12 students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
http: ^1.2.2 aur path_provider: ^2.1.4
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  syncfusion_flutter_pdfviewer: ^32.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/books/class9/class9.json
    - assets/books/class10/class10.json
    - assets/books/class11/class11.json
    - assets/books/class12/class12.json
